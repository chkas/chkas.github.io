name: Copy Easylang

on:
  push:
    branches: ["mainx"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Clone
        run: |
          cd
          mkdir el
          cd el
          sh $GITHUB_WORKSPACE/getel.sh https://tiki.li
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: /home/runner/el
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
